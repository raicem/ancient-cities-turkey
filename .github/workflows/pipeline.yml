name: Pipeline

on: [push]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, gd, sqlite, curl

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Get Composer Cache Directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - uses: actions/cache@v4
      id: composer_cache
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: dependencies-laravel-composer-${{ hashFiles('composer.lock') }}
        restore-keys: dependencies-laravel-composer-

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-interaction

    - name: Generate key
      run: php artisan key:generate

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install NPM Dependencies
      run: npm ci

    - name: Build Assets
      run: npm run build

    - name: Execute tests with PHPUnit
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: ':memory:'
      run: vendor/bin/phpunit
    - name: Code Style Check
      run: ./vendor/bin/php-cs-fixer fix --dry-run --using-cache=no
    - name: Static Analysis
      run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G
