services:
  php:
    build:
      context: ./docker/php
    ports:
      - 9000:9000
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
  nginx:
    build:
      context: ./docker/nginx
    ports:
      - 80:80
    depends_on:
      - php
    volumes:
      - .:/var/www/html
  mysql:
    image: mysql:8.0
    ports:
      - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_DATABASE: 'ruins'
      MYSQL_USER: 'ruins'
      MYSQL_PASSWORD: 'secret'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20
